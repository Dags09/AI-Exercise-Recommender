<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercise Recommender</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>

    <h1>🏋️ Exercise Recommender</h1>

    <form id="prediction-form">
        <div>
            <label for="level">Level</label>
            <select id="level" required>
                <option value="" disabled selected>Select Level</option>
                <option value="Beginner">Beginner</option>
                <option value="Intermediate">Intermediate</option>
                <option value="Expert">Expert</option>
            </select>
        </div>

        <div>
            <label for="bodypart">Target Body Part</label>
            <select id="bodypart" required>
                <option value="" disabled selected>Select Body Part</option>
                <option value="Abdominals">Abdominals</option>
                <option value="Chest">Chest</option>
                <option value="Back">Back</option>
                <option value="Shoulders">Shoulders</option>
                <option value="Biceps">Biceps</option>
                <option value="Triceps">Triceps</option>
                <option value="Quadriceps">Quadriceps</option>
                <option value="Hamstrings">Hamstrings</option>
                <option value="Glutes">Glutes</option>
                <option value="Calves">Calves</option>
            </select>
        </div>

        <div>
            <label for="type">Exercise Type</label>
            <select id="type" required>
                <option value="" disabled selected>Select Type</option>
                <option value="Cardio">Cardio</option>
                <option value="Strength">Strength</option>
                <option value="Stretching">Stretching</option>
                <option value="Plyometrics">Plyometrics</option>
                <option value="Powerlifting">Powerlifting</option>
                <option value="Olympic Weightlifting">Olympic Weightlifting</option>
                <option value="Strongman">Strongman</option>
            </select>
        </div>
        
        <div>
            <label for="equipment">Equipment (Optional)</label>
            <select id="equipment">
                <option value="" selected>Any Equipment</option>
                <option value="Bands">Bands</option>
                <option value="Barbell">Barbell</option>
                <option value="Body Only">Body Only</option>
                <option value="Cable">Cable</option>
                <option value="Dumbbell">Dumbbell</option>
                <option value="Machine">Machine</option>
                <option value="None">None</option>
            </select>
        </div>

        <button type="submit">Find Exercises</button>
    </form>

    <div id="results-wrapper" style="display:none; margin-top:30px;">
        
        <div class="results-header">
            <h3 style="margin:0;">Found <span id="result-count">0</span> exercises</h3>
            
            <div class="sort-control">
                <label for="sort-order" style="display:inline; margin-right:10px;">Sort by Rating:</label>
                <select id="sort-order">
                    <option value="desc">Highest First ⬇</option>
                    <option value="asc">Lowest First ⬆</option>
                </select>
            </div>
        </div>

        <div id="results-list"></div>
    </div>

    <script>
        // Global variable to store the current search results
        let currentExercises = [];

        // Helper to convert rating strings (e.g. "8.5", "8.25 - 8.45", "N/A") into sortable numbers
        function parseRating(ratingStr) {
            if (!ratingStr || ratingStr === "N/A" || ratingStr === "Unknown") return -1;
            
            // Handle ranges like "8.25 - 8.45" by taking the average
            if (ratingStr.includes("-")) {
                const parts = ratingStr.split("-");
                const num1 = parseFloat(parts[0]);
                const num2 = parseFloat(parts[1]);
                return (num1 + num2) / 2;
            }
            
            return parseFloat(ratingStr) || -1;
        }

        // Function to render the list based on the current sort order
        function renderList() {
            const listContainer = document.getElementById('results-list');
            const sortOrder = document.getElementById('sort-order').value;

            // Sort the data
            currentExercises.sort((a, b) => {
                const valA = parseRating(String(a.Rating));
                const valB = parseRating(String(b.Rating));

                if (sortOrder === 'asc') {
                    return valA - valB;
                } else {
                    return valB - valA;
                }
            });

            // Clear and rebuild HTML
            listContainer.innerHTML = "";
            
            if (currentExercises.length > 0) {
                currentExercises.forEach(ex => {
                    const cardHTML = `
                        <div class="card" style="margin-bottom: 20px;">
                            <div class="card-header" style="display:flex; justify-content:space-between; align-items:center;">
                                <div class="meta-title" style="margin:0; font-size:1.3em;">${ex.Title}</div>
                                <div style="background:white; color:#28a745; padding:5px 10px; border-radius:5px; font-weight:bold;">
                                    ${ex.Rating} / 10
                                </div>
                            </div>
                            <div class="card-body">
                                <div class="meta-item">
                                    <span class="label-tag">Equipment:</span>
                                    <span>${ex.Equipment}</span>
                                </div>
                                <div class="meta-item">
                                    <span class="label-tag">Description:</span>
                                    <span>${ex.Description}</span>
                                </div>
                            </div>
                        </div>
                    `;
                    listContainer.innerHTML += cardHTML;
                });
            } else {
                listContainer.innerHTML = "<p style='text-align:center; margin-top:20px;'>No exercises found.</p>";
            }
        }

        // Event Listener for Sort Dropdown
        document.getElementById('sort-order').addEventListener('change', renderList);

        // Main Form Submit Handler
        document.getElementById('prediction-form').addEventListener('submit', async function(e) {
            e.preventDefault(); 

            const wrapper = document.getElementById('results-wrapper');
            const btn = document.querySelector('button');
            
            btn.innerText = "AI is analyzing...";
            wrapper.style.display = 'none';

            const payload = {
                'Level': document.getElementById('level').value,
                'BodyPart': document.getElementById('bodypart').value,
                'Type': document.getElementById('type').value,
                'Equipment': document.getElementById('equipment').value
            };

            try {
                const response = await fetch('/predict', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                const data = await response.json();

                if (response.ok) {
                    // Store results globally so we can sort them later
                    currentExercises = data.exercises || [];
                    
                    document.getElementById('result-count').innerText = data.count;
                    wrapper.style.display = 'block';
                    
                    // Initial Render
                    renderList();

                } else {
                    alert("Error: " + data.error);
                }
            } catch (err) {
                console.error(err);
                alert("Network Error: " + err.message);
            } finally {
                btn.innerText = "Find Exercises";
            }
        });
    </script>

</body>
</html>
